name: Update data and deploy

on:
  schedule:
    # Times are UTC. Covers the usual PL rhythm: after Sat/Sun rounds and
    # midweek fixtures. Cron on GitHub is best-effort and can run late.
    - cron: '0 23 * * 0'   # Sunday night  - after the weekend round
    - cron: '0 23 * * 2'   # Tuesday night - midweek fixtures
    - cron: '0 23 * * 3'   # Wednesday night
    - cron: '0 11 * * 1'   # Monday midday - catch late-published results
  workflow_dispatch:        # lets you trigger a refresh by hand
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh match data
        run: python3 scripts/build_data.py

      - name: Commit data.json if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No new results."
          else
            git commit -m "Update results ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
